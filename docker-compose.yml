services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: offpay
      POSTGRES_PASSWORD: offpay
      POSTGRES_DB: offpay
    ports:
      - "5432:5432"
    volumes:
      - offpay_pgdata:/var/lib/postgresql/data

volumes:
  offpay_pgdata:
